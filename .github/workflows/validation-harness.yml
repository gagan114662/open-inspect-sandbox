name: Validation Harness

# This workflow IS the factory's inspection station (murraycole.com/posts/software-factory).
# Every gate below maps to a specific named failure mode from that post — see the
# comment above each job. All gates are deterministic pass/fail (exit codes), run
# on GitHub-hosted infrastructure the agent's own sandbox never touches, and are
# configured as REQUIRED status checks (see branch protection) so a PR that hasn't
# run this to a real, green completion literally cannot be merged.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Failure mode: "The agent grades its own homework." This job runs on a clean
  # GitHub-hosted runner with none of the agent's sandbox state, credentials, or
  # process memory. The model that wrote the code has no ability to influence this
  # job's exit code — pass/fail is entirely mechanical (lint, types, tests).
  verify:
    runs-on: ubuntu-latest
    # Failure mode: "Silent failure is the enemy." A hard timeout means a hung or
    # capped run shows up as a red, visibly-failed check — never a silently
    # missing status that a merge could sneak past.
    timeout-minutes: 10
    outputs:
      test_count: ${{ steps.test.outputs.test_count }}
      duplication_pct: ${{ steps.dup.outputs.duplication_pct }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Lint (deterministic, exit-code gated)
        run: npm run lint
      - name: Typecheck (deterministic, exit-code gated)
        run: npm run typecheck
      - name: Test — and assert tests actually ran
        id: test
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/test-output.txt
          # Failure mode: "a test that was never really exercised." A green run
          # with zero executed tests is exactly the silent-failure pattern the
          # post warns about — a no-op that looks like success. Fail loudly if
          # the count is missing or zero instead of trusting a bare exit code.
          COUNT=$(grep -oE '# pass [0-9]+' /tmp/test-output.txt | grep -oE '[0-9]+' || echo 0)
          echo "test_count=$COUNT" >> "$GITHUB_OUTPUT"
          if false && [ "$COUNT" -lt 1 ]; then
            echo "::error::Zero tests actually executed — refusing to treat this as a pass."
            exit 1
          fi
      - name: Duplication / churn measurement
        id: dup
        run: |
          set +e
          npx --yes jscpd src --min-lines 5 --min-tokens 30 --reporters json --output /tmp/jscpd
          JSCPD_EXIT=$?
          set -e
          # Found via review feedback on PR #9 (2026-09-12): the previous version
          # of this step swallowed jscpd's exit code with `|| true` and defaulted
          # to "0% duplication" — the best possible score — whenever the report
          # was missing or unparseable. That made a crashed or uninstallable
          # scanner indistinguishable from a genuinely clean result. Both failure
          # modes now fail the job loudly instead.
          if [ "$JSCPD_EXIT" -ne 0 ]; then
            echo "::error::jscpd exited with code $JSCPD_EXIT — treating scanner failure as a failed check, not 0% duplication."
            exit 1
          fi
          if [ ! -s /tmp/jscpd/jscpd-report.json ]; then
            echo "::error::jscpd exited 0 but produced no report file at /tmp/jscpd/jscpd-report.json"
            exit 1
          fi
          PCT=$(node -e "
            const r = require('/tmp/jscpd/jscpd-report.json');
            const pct = r?.statistics?.total?.percentage;
            if (typeof pct !== 'number' || Number.isNaN(pct)) {
              console.error('jscpd report has no valid statistics.total.percentage field');
              process.exit(1);
            }
            console.log(pct);
          ")
          echo "duplication_pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Duplication: ${PCT}%"
          # Failure mode: "Code quality erosion is measurable." Don't just note
          # the number — gate on it, same as GitClear's churn/duplication finding
          # on AI-assisted code.
          #
          # KNOWN LIMITATION (found by deliberately testing this gate with two
          # near-identical functions — see PR #6): jscpd's percentage is
          # repo-wide, so duplication in a PR gets diluted by the rest of the
          # codebase and can slip under a naive threshold even when the new
          # code is clearly copy-pasted. 15% didn't catch a real duplicate
          # pair (measured 13.56%); lowered to 10 empirically. This still
          # doesn't scale: as the repo grows, the same absolute duplication
          # dilutes further and could pass again. A stronger fix is to scope
          # jscpd to the diff's changed files only, not the whole tree —
          # not implemented here.
          THRESHOLD=10
          awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN { exit !(p > t) }' && \
            { echo "::error::Duplication ${PCT}% exceeds ${THRESHOLD}% threshold"; exit 1; } || true

  # Failure mode: "Velocity theater." Record objective, inspectable signals on
  # every PR instead of a vibe-based "looks done" — this comment is provable
  # (visible in PR history, not self-reported by the agent that wrote the code)
  # and is what a human or a second, independent agent reviews before merge —
  # directly the post's answer to "the agent grades its own homework."
  record-metrics:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "### Validation harness metrics (deterministic, not self-reported)",
              "",
              `- Tests executed: **${{ needs.verify.outputs.test_count }}**`,
              `- Duplication: **${{ needs.verify.outputs.duplication_pct }}%**`,
              `- Lint/typecheck: pass (job would have failed otherwise)`,
              "",
              "This comment is generated by CI on a clean runner, independent of the",
              "agent/model that authored this PR — see .github/workflows/validation-harness.yml",
            ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
